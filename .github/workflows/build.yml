name: Derleme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    name: Analiz ve test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # Televizyon, tablet ve telefon ayrı APK'lardır (android/app/build.gradle.kts).
    name: Android APK (${{ matrix.flavor }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [tv, tablet, phone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Keystore tanımlanana kadar release, Flutter şablonunun debug imzasını kullanır.
      # İşlemciye göre ayrı APK: media_kit'in yerel kütüphaneleri her işlemci
      # için ~25 MB; tek APK'da hepsi birden olurdu.
      - run: flutter build apk --release --split-per-abi --flavor ${{ matrix.flavor }}
      - uses: actions/upload-artifact@v7
        with:
          name: redox-tv-android-${{ matrix.flavor }}
          path: build/app/outputs/flutter-apk/app-*-${{ matrix.flavor }}-release.apk
          if-no-files-found: error

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: redox-tv-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux derleme bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: redox-tv-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error
