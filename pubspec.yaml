name: redox_tv
description: "RedoX TV 3.0: Android TV, tablet, telefon, Windows ve Linux için IPTV istemcisi."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.2
  # Tonal paletler çalışma anında tohumlardan hesaplanır (HCT). Sürüm Flutter
  # SDK'nın sabitlediği sürümle aynıdır.
  material_color_utilities: 0.13.0
  # Oynatıcı: libmpv tabanlı; Android/Android TV, Windows ve Linux'ta HLS
  # (m3u8) ve MPEG-TS oynatır (video_player Windows/Linux'u desteklemiyor).
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  # Yayın akışı (XMLTV) çözümü. flutter_svg zaten bu sürümü kullanıyor.
  xml: 7.0.1
  # Şifreli veri paketleri: AES-256-GCM çözme, Ed25519 imza doğrulama.
  cryptography: 2.9.0
  # Son izlenen kanallar cihazda saklanır (Flutter ekibinin paketi).
  shared_preferences: 2.5.6
  file_picker: ^13.3.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Testlerde zaman: radyo bağlanma süresi ve uyku zamanlayıcısı.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/brand/redox-logo.svg
    - assets/brand/redox-logo-saydam.png
    - assets/brand/redox-mark.png
    - assets/brand/redox-mark.svg
    - assets/icons/
    # Şifreli kanal listesi (DataPack). Kaynak tr.m3u uygulamaya konmaz.
    - assets/channels/channels.bin
    - assets/radios/radios.bin
    - assets/sounds/radyo_cizirti.wav

  fonts:
    # Değişken yazı tipi (OFL), tek eksen: wght 100–800. FontWeight -> wght.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
