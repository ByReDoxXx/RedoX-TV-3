name: redox_tv
description: "RedoX TV 3.0: Android TV, tablet, telefon, Windows ve Linux için IPTV istemcisi."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_color_utilities: 0.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/redox-logo.svg
    - assets/icons/

  fonts:
    # Değişken yazı tipi (OFL): FontWeight -> wght ekseni; slnt/opsz FontVariation ile.
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
